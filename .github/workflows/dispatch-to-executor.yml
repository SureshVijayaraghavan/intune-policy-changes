name: Dispatch change to executor

on:
  push:
    branches: [main]
    paths:
      - 'changes/**/*.json'
  workflow_dispatch:
    inputs:
      change_file:
        description: Path to a change JSON under changes/ (e.g. changes/example-ios-compliance-update.json)
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve change files
        id: resolve
        env:
          MANUAL_FILE: ${{ inputs.change_file }}
        run: |
          set -euo pipefail
          files=()
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            files+=("${MANUAL_FILE}")
          else
            while IFS= read -r f; do
              [ -n "$f" ] && files+=("$f")
            done < <(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'changes/**/*.json' || true)
            # First push / shallow edge case: dispatch all change JSONs that are not placeholders-only if diff empty
            if [ ${#files[@]} -eq 0 ]; then
              while IFS= read -r f; do
                files+=("$f")
              done < <(find changes -type f -name '*.json' | sort)
            fi
          fi

          if [ ${#files[@]} -eq 0 ]; then
            echo "No change files to dispatch."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${files[@]}" > /tmp/change-files.txt
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          echo "Resolved files:"
          cat /tmp/change-files.txt

      - name: Validate change JSON syntax and schema
        if: steps.resolve.outputs.count != '0'
        run: |
          set -euo pipefail
          failed=0

          while IFS= read -r file; do
            echo "Validating $file"

            if [ ! -f "$file" ]; then
              echo "::error file=$file::File not found"
              failed=1
              continue
            fi

            if ! jq empty "$file" 2>/tmp/jq-err; then
              echo "::error file=$file::Invalid JSON syntax: $(tr '\n' ' ' </tmp/jq-err)"
              failed=1
              continue
            fi

            if ! jq -e 'type == "object"' "$file" >/dev/null; then
              echo "::error file=$file::Root value must be a JSON object"
              failed=1
              continue
            fi

            action=$(jq -r '.action // empty' "$file")
            platform=$(jq -r '.platform // empty' "$file")
            policyId=$(jq -r '.policyId // empty' "$file")
            patchType=$(jq -r '.patch | type' "$file")

            if [ -z "$action" ]; then
              echo "::error file=$file::Missing required string field: action"
              failed=1
            elif [ "$action" != "updateCompliancePolicy" ]; then
              echo "::error file=$file::Unsupported action '$action' (expected updateCompliancePolicy)"
              failed=1
            fi

            if [ -z "$platform" ]; then
              echo "::error file=$file::Missing required string field: platform"
              failed=1
            elif [ "$platform" != "iOS" ] && [ "$platform" != "Android" ] && [ "$platform" != "Windows" ]; then
              echo "::error file=$file::platform must be iOS, Android, or Windows (got '$platform')"
              failed=1
            fi

            if [ -z "$policyId" ]; then
              echo "::error file=$file::Missing required string field: policyId"
              failed=1
            fi

            if [ "$patchType" != "object" ]; then
              echo "::error file=$file::patch must be a JSON object (got $patchType)"
              failed=1
            elif ! jq -e '.patch["@odata.type"] | type == "string" and length > 0' "$file" >/dev/null; then
              echo "::error file=$file::patch.@odata.type is required and must be a non-empty string"
              failed=1
            fi

            if jq empty "$file" >/dev/null 2>&1; then
              echo "Checked: $file"
            fi
          done < /tmp/change-files.txt

          if [ "$failed" -ne 0 ]; then
            echo "JSON validation failed — private executor will not be triggered." >&2
            exit 1
          fi

          echo "All change files passed JSON validation."

      - name: Dispatch each change to private executor
        if: steps.resolve.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.EXECUTOR_DISPATCH_TOKEN }}
          EXECUTOR_REPO: ${{ vars.EXECUTOR_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "Missing secret EXECUTOR_DISPATCH_TOKEN" >&2
            exit 1
          fi
          EXECUTOR_REPO="${EXECUTOR_REPO:-SureshVijayaraghavan/intune-cicd-poc}"


          while IFS= read -r file; do
            echo "Processing $file"
            if [ ! -f "$file" ]; then
              echo "File not found: $file" >&2
              exit 1
            fi

            action=$(jq -r '.action // empty' "$file")
            if [ "$action" != "updateCompliancePolicy" ]; then
              echo "Skipping unsupported action '$action' in $file"
              continue
            fi

            platform=$(jq -r '.platform' "$file")
            policyId=$(jq -r '.policyId' "$file")
            patch=$(jq -c '.patch' "$file")

            if [ -z "$policyId" ] || [ "$policyId" = "REPLACE_WITH_INTUNE_POLICY_GUID" ]; then
              echo "Skipping $file — set a real policyId before dispatching."
              continue
            fi

            payload=$(jq -n \
              --arg platform "$platform" \
              --arg policyId "$policyId" \
              --argjson patch "$patch" \
              --arg sourceFile "$file" \
              --arg sourceRepo "$GITHUB_REPOSITORY" \
              --arg sourceSha "$GITHUB_SHA" \
              '{platform:$platform, policyId:$policyId, patch:$patch, sourceFile:$sourceFile, sourceRepo:$sourceRepo, sourceSha:$sourceSha}')

            echo "Dispatching compliance-policy-update for policyId=$policyId"
            jq -n \
              --arg event_type "compliance-policy-update" \
              --argjson client_payload "$payload" \
              '{event_type:$event_type, client_payload:$client_payload}' \
              | gh api --method POST "repos/${EXECUTOR_REPO}/dispatches" --input -

            echo "Dispatched from $file"
          done < /tmp/change-files.txt
